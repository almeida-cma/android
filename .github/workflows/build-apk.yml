name: Gerar APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Criar projeto
        run: |
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Criar página mínima
        run: |
          mkdir -p www
          cat > www/index.html <<'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8">
            <title>Almeida App</title>
          </head>
          <body>
            <p>Carregando...</p>
          </body>
          </html>
          EOF

      - name: Configurar Capacitor
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.almeida.android",
            "appName": "Almeida App",
            "webDir": "www",
            "server": {
              "url": "https://almeida-cma.github.io/android/",
              "cleartext": false
            }
          }
          EOF

      - name: Adicionar Android
        run: npx cap add android

      - name: Sincronizar
        run: npx cap sync android

      - name: Gerar APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Almeida-App-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
