<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi App</title>
    <link rel="manifest" href="manifest.json">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f5f5;
            padding: 16px;
            max-width: 500px;
            margin: 0 auto;
        }
        .tab-bar {
            display: flex;
            gap: 4px;
            background: white;
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .tab-bar button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            background: transparent;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tab-bar button.ativo {
            background: #1a237e;
            color: white;
        }
        .tab { display: none; }
        .tab.ativo { display: block; }
        .card {
            background: white;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .card h3 { color: #1a237e; margin-bottom: 8px; }
        .dados-sensor {
            font-family: monospace;
            font-size: 0.85rem;
            background: #f5f5f5;
            padding: 12px;
            border-radius: 8px;
            white-space: pre-wrap;
            line-height: 1.4;
        }
        video { width: 100%; border-radius: 8px; background: #000; }
        button {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            background: #1a237e;
            color: white;
            cursor: pointer;
            margin: 4px;
        }
        button:disabled { opacity: 0.5; }
        .status { 
            display: inline-block; 
            padding: 2px 10px; 
            border-radius: 10px; 
            font-size: 0.8rem;
            font-weight: 500;
        }
        .verde { background: #4CAF50; color: white; }
        .vermelho { background: #f44336; color: white; }
    </style>
</head>
<body>

    <!-- TABS -->
    <div class="tab-bar">
        <button class="ativo" data-tab="tab-portos">🚢 Portos</button>
        <button data-tab="tab-camera">📷 Câmera</button>
        <button data-tab="tab-gps">📍 GPS</button>
        <button data-tab="tab-sensores">📱 Sensores</button>
        <button data-tab="tab-bluetooth">🔵 Bluetooth</button>
    </div>

    <!-- TAB: PORTOS (JSON) -->
    <div id="tab-portos" class="tab ativo">
        <div class="card">
            <h3>⚓ Catálogo de Portos</h3>
            <div id="portos-container"></div>
            <div style="margin-top:8px;font-size:0.8rem;color:#888;">
                Atualizado: <span id="update-time">--</span>
            </div>
        </div>
    </div>

    <!-- TAB: CÂMERA -->
    <div id="tab-camera" class="tab">
        <div class="card">
            <h3>📷 Câmera</h3>
            <video id="video" autoplay playsinline></video>
            <div style="margin-top:8px;">
                <button id="btn-cam-front">🔁 Alternar</button>
                <button id="btn-cam-capture">📸 Foto</button>
                <button id="btn-cam-stop">⏹ Parar</button>
            </div>
            <img id="cam-preview" style="display:none;width:100%;border-radius:8px;margin-top:8px;" />
            <canvas id="cam-canvas" style="display:none;"></canvas>
        </div>
    </div>

    <!-- TAB: GPS -->
    <div id="tab-gps" class="tab">
        <div class="card">
            <h3>📍 Localização</h3>
            <div id="gps-info" class="dados-sensor">
                Clique em "Buscar" ou "Rastrear"
            </div>
            <div style="margin-top:8px;">
                <button id="btn-gps-once">📍 Buscar</button>
                <button id="btn-gps-watch">👁️ Rastrear</button>
            </div>
        </div>
    </div>

    <!-- TAB: SENSORES -->
    <div id="tab-sensores" class="tab">
        <div class="card">
            <h3>📱 Sensores de Movimento</h3>
            <div style="margin-bottom: 8px;">
                <span id="sens-status-acel" class="status vermelho">⏹ Acelerômetro</span>
                <span id="sens-status-giro" class="status vermelho">⏹ Giroscópio</span>
            </div>
            <div id="sens-dados" class="dados-sensor">
                Aguardando início...
            </div>
            <div style="margin-top:8px;">
                <button id="btn-sens-start">▶ Iniciar Sensores</button>
                <button id="btn-sens-stop">⏹ Parar Sensores</button>
            </div>
        </div>
    </div>

    <!-- TAB: BLUETOOTH -->
    <div id="tab-bluetooth" class="tab">
        <div class="card">
            <h3>🔵 Bluetooth</h3>
            <div id="bt-dados" class="dados-sensor">
                Clique em "Escanear"
            </div>
            <div style="margin-top:8px;">
                <button id="btn-bt-scan">📡 Escanear</button>
                <button id="btn-bt-disconnect" disabled>⏹ Desconectar</button>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // 1. PORTOS (JSON)
        // ============================================
        const portosContainer = document.getElementById('portos-container');
        const updateTime = document.getElementById('update-time');

        const portosData = [
            { nome: 'Porto de Santos', localizacao: 'Santos, SP', descricao: 'Maior porto da América Latina' },
            { nome: 'Porto do Rio', localizacao: 'Rio de Janeiro, RJ', descricao: 'Porto histórico e de cruzeiros' },
            { nome: 'Porto de Paranaguá', localizacao: 'Paranaguá, PR', descricao: 'Grande polo de exportação de grãos' }
        ];

        function renderizarPortos() {
            portosContainer.innerHTML = portosData.map(p => `
                <div style="padding:10px;border-bottom:1px solid #eee;">
                    <strong>${p.nome}</strong><br>
                    📍 ${p.localizacao}<br>
                    <span style="font-size:0.9rem;color:#666;">${p.descricao}</span>
                </div>
            `).join('');
            updateTime.textContent = new Date().toLocaleString();
        }
        renderizarPortos();

        // ============================================
        // 2. CÂMERA
        // ============================================
        const video = document.getElementById('video');
        const canvas = document.getElementById('cam-canvas');
        const preview = document.getElementById('cam-preview');
        let stream = null;
        let facingMode = 'environment';

        async function startCamera() {
            try {
                if (stream) stream.getTracks().forEach(t => t.stop());
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { ideal: facingMode }, width: { ideal: 640 }, height: { ideal: 480 } },
                    audio: false
                });
                video.srcObject = stream;
                await video.play();
            } catch (e) {
                console.error(e);
            }
        }

        document.getElementById('btn-cam-front').addEventListener('click', () => {
            facingMode = facingMode === 'environment' ? 'user' : 'environment';
            startCamera();
        });

        document.getElementById('btn-cam-capture').addEventListener('click', () => {
            if (!video.videoWidth) return;
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            preview.src = canvas.toDataURL('image/jpeg');
            preview.style.display = 'block';
        });

        document.getElementById('btn-cam-stop').addEventListener('click', () => {
            if (stream) { 
                stream.getTracks().forEach(t => t.stop()); 
                stream = null; 
                video.srcObject = null; 
            }
        });

        // ============================================
        // 3. GPS
        // ============================================
        const gpsInfo = document.getElementById('gps-info');
        let watchId = null;

        function atualizarGPS(pos) {
            const { latitude, longitude, accuracy, altitude, speed } = pos.coords;
            gpsInfo.textContent = `📍 Lat: ${latitude.toFixed(6)}\n📍 Long: ${longitude.toFixed(6)}\n🎯 Precisão: ${accuracy.toFixed(1)}m\n⛰️ Altitude: ${altitude ? altitude.toFixed(1) + 'm' : 'N/A'}\n🏎️ Velocidade: ${speed ? (speed * 3.6).toFixed(1) + ' km/h' : '0 km/h'}`;
        }

        function erroGPS(err) {
            gpsInfo.textContent = `❌ Erro GPS: ${err.message}`;
        }

        document.getElementById('btn-gps-once').addEventListener('click', () => {
            if (watchId) { navigator.geolocation.clearWatch(watchId); watchId = null; }
            if (!navigator.geolocation) { gpsInfo.textContent = '❌ GPS não suportado'; return; }
            gpsInfo.textContent = '⏳ Obtendo localização...';
            navigator.geolocation.getCurrentPosition(atualizarGPS, erroGPS, { enableHighAccuracy: true });
        });

        document.getElementById('btn-gps-watch').addEventListener('click', () => {
            if (watchId) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
                gpsInfo.textContent = '👁️ Rastreamento parado';
                return;
            }
            if (!navigator.geolocation) { gpsInfo.textContent = '❌ GPS não suportado'; return; }
            watchId = navigator.geolocation.watchPosition(atualizarGPS, erroGPS, { enableHighAccuracy: true });
            gpsInfo.textContent = '👁️ Rastreando continuamente...';
        });

        // ============================================
        // 4. SENSORES (ACELERÔMETRO & GIROSCÓPIO)
        // ============================================
        const sensDados = document.getElementById('sens-dados');
        const sensStatusAcel = document.getElementById('sens-status-acel');
        const sensStatusGiro = document.getElementById('sens-status-giro');
        let sensRunning = false;

        let aceleracaoTxt = '📊 Acel: Aguardando...';
        let giroscopioTxt = '🔄 Giro: Aguardando...';

        function renderizarDadosSensores() {
            sensDados.textContent = `${aceleracaoTxt}\n\n${giroscopioTxt}`;
        }

        function handleMotion(e) {
            if (!sensRunning) return;
            // Usa aceleração linear ou aceleração com gravidade como fallback
            const accel = e.acceleration?.x !== null && e.acceleration?.x !== undefined 
                ? e.acceleration 
                : e.accelerationIncludingGravity;

            if (accel && (accel.x !== null || accel.y !== null)) {
                aceleracaoTxt = `📊 Aceleração:\n  X: ${(accel.x || 0).toFixed(2)} m/s²\n  Y: ${(accel.y || 0).toFixed(2)} m/s²\n  Z: ${(accel.z || 0).toFixed(2)} m/s²`;
                sensStatusAcel.className = 'status verde';
                sensStatusAcel.textContent = '✅ Acelerômetro';
            }

            // Se o navegador enviar velocidade angular no devicemotion:
            if (e.rotationRate && (e.rotationRate.alpha !== null)) {
                giroscopioTxt = `🔄 Giroscópio (Vel. Angular):\n  α: ${(e.rotationRate.alpha || 0).toFixed(1)}°/s\n  β: ${(e.rotationRate.beta || 0).toFixed(1)}°/s\n  γ: ${(e.rotationRate.gamma || 0).toFixed(1)}°/s`;
                sensStatusGiro.className = 'status verde';
                sensStatusGiro.textContent = '✅ Giroscópio';
            }
            renderizarDadosSensores();
        }

        function handleOrientation(e) {
            if (!sensRunning) return;
            // O DeviceOrientationEvent mede a orientação espacial em graus:
            // alpha: 0 a 360° (direção/bússola)
            // beta: -180 a 180° (frente/trás)
            // gamma: -90 a 90° (esquerda/direita)
            if (e.alpha !== null || e.beta !== null || e.gamma !== null) {
                giroscopioTxt = `🔄 Orientação / Giro:\n  Bússola (α): ${(e.alpha || 0).toFixed(1)}°\n  Pitch (β):    ${(e.beta || 0).toFixed(1)}°\n  Roll (γ):     ${(e.gamma || 0).toFixed(1)}°`;
                sensStatusGiro.className = 'status verde';
                sensStatusGiro.textContent = '✅ Giroscópio';
                renderizarDadosSensores();
            }
        }

        document.getElementById('btn-sens-start').addEventListener('click', async () => {
            // Solicitação de permissão específica para iOS 13+ (Safari)
            try {
                if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
                    const permMotion = await DeviceMotionEvent.requestPermission();
                    if (permMotion !== 'granted') throw new Error('Permissão de movimento negada.');
                }
                if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                    const permOrient = await DeviceOrientationEvent.requestPermission();
                    if (permOrient !== 'granted') throw new Error('Permissão de orientação negada.');
                }
            } catch (err) {
                sensDados.textContent = `❌ ${err.message}`;
                return;
            }

            sensRunning = true;
            window.addEventListener('devicemotion', handleMotion);
            window.addEventListener('deviceorientation', handleOrientation);
            sensDados.textContent = '⏳ Capturando dados dos sensores...';
        });

        document.getElementById('btn-sens-stop').addEventListener('click', () => {
            sensRunning = false;
            window.removeEventListener('devicemotion', handleMotion);
            window.removeEventListener('deviceorientation', handleOrientation);
            sensDados.textContent = '⏹ Parado';
            sensStatusAcel.className = 'status vermelho';
            sensStatusAcel.textContent = '⏹ Acelerômetro';
            sensStatusGiro.className = 'status vermelho';
            sensStatusGiro.textContent = '⏹ Giroscópio';
        });

        // ============================================
        // 5. BLUETOOTH
        // ============================================
        const btDados = document.getElementById('bt-dados');
        const btScan = document.getElementById('btn-bt-scan');
        const btDisconnect = document.getElementById('btn-bt-disconnect');
        let btDevice = null;
        let btServer = null;

        async function scanBluetooth() {
            if (!navigator.bluetooth) {
                btDados.textContent = '❌ Web Bluetooth não é suportado neste navegador.';
                return;
            }
            try {
                btDados.textContent = '⏳ Buscando dispositivos...';
                btScan.disabled = true;
                btDevice = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: ['battery_service']
                });
                btDados.textContent = `✅ Pareado: ${btDevice.name || 'Dispositivo sem nome'}`;
                btServer = await btDevice.gatt.connect();
                btDados.textContent += `\n🔗 Conexão GATT estabelecida!`;

                try {
                    const svc = await btServer.getPrimaryService('battery_service');
                    const char = await svc.getCharacteristic('battery_level');
                    const val = await char.readValue();
                    btDados.textContent += `\n🔋 Nível de Bateria: ${val.getUint8(0)}%`;
                } catch (e) {
                    btDados.textContent += `\nℹ️ Sem serviço de bateria padrão.`;
                }
                btDisconnect.disabled = false;
            } catch (e) {
                if (!e.message.includes('User cancelled')) {
                    btDados.textContent = `❌ Erro Bluetooth: ${e.message}`;
                } else {
                    btDados.textContent = '⏹ Busca cancelada.';
                }
            } finally {
                btScan.disabled = false;
            }
        }

        function disconnectBluetooth() {
            if (btServer && btServer.connected) { 
                btServer.disconnect(); 
            }
            if (btDevice?.gatt?.connected) {
                btDevice.gatt.disconnect();
            }
            btDados.textContent = '⏹ Desconectado com sucesso.';
            btDisconnect.disabled = true;
            btDevice = null;
            btServer = null;
        }

        btScan.addEventListener('click', scanBluetooth);
        btDisconnect.addEventListener('click', disconnectBluetooth);

        // ============================================
        // NAVEGAÇÃO ENTRE ABAS
        // ============================================
        document.querySelectorAll('.tab-bar button').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-bar button').forEach(b => b.classList.remove('ativo'));
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('ativo'));
                btn.classList.add('ativo');
                
                const targetTab = document.getElementById(btn.dataset.tab);
                if (targetTab) {
                    targetTab.classList.add('ativo');
                }

                // Inicia a câmera apenas quando entrar na aba de câmera
                if (btn.dataset.tab === 'tab-camera' && !stream) {
                    startCamera();
                }
            });
        });
    </script>
</body>
</html>
