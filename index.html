<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi App</title>
    <link rel="manifest" href="manifest.json">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f5f5;
            padding: 16px;
            max-width: 500px;
            margin: 0 auto;
        }
        .tab-bar {
            display: flex;
            gap: 4px;
            background: white;
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .tab-bar button {
            flex: 1;
            padding: 10px 4px;
            border: none;
            border-radius: 8px;
            background: transparent;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            color: #555;
        }
        .tab-bar button.ativo {
            background: #1a237e;
            color: white;
        }
        .tab { display: none; }
        .tab.ativo { display: block; }
        .card {
            background: white;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .card h3 { color: #1a237e; margin-bottom: 12px; }
        .dados-box {
            font-family: monospace;
            font-size: 0.85rem;
            background: #1e1e1e;
            color: #00e676;
            padding: 12px;
            border-radius: 8px;
            white-space: pre-wrap;
            line-height: 1.5;
            min-height: 80px;
        }
        video { width: 100%; border-radius: 8px; background: #000; }
        button.btn-app {
            padding: 10px 14px;
            border: none;
            border-radius: 8px;
            background: #1a237e;
            color: white;
            cursor: pointer;
            margin: 4px 2px;
            font-size: 0.85rem;
            font-weight: 500;
        }
        button.btn-app:disabled { opacity: 0.5; }
        .status { 
            display: inline-block; 
            padding: 3px 8px; 
            border-radius: 6px; 
            font-size: 0.75rem;
            font-weight: bold;
        }
        .verde { background: #4CAF50; color: white; }
        .vermelho { background: #f44336; color: white; }
        .link-maps {
            display: inline-block;
            margin-top: 10px;
            padding: 8px 12px;
            background: #2e7d32;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <!-- BARRA DE ABAS -->
    <div class="tab-bar">
        <button class="ativo" data-tab="tab-portos">🚢 Portos</button>
        <button data-tab="tab-camera">📷 Câmera</button>
        <button data-tab="tab-gps">📍 GPS</button>
        <button data-tab="tab-acelerometro">📊 Acelerômetro</button>
    </div>

    <!-- TAB 1: PORTOS (JSON) -->
    <div id="tab-portos" class="tab ativo">
        <div class="card">
            <h3>⚓ Catálogo de Portos</h3>
            <div id="portos-container"></div>
            <div style="margin-top:8px;font-size:0.8rem;color:#888;">
                Atualizado: <span id="update-time">--</span>
            </div>
        </div>
    </div>

    <!-- TAB 2: CÂMERA -->
    <div id="tab-camera" class="tab">
        <div class="card">
            <h3>📷 Câmera</h3>
            <video id="video" autoplay playsinline></video>
            <div style="margin-top:8px;">
                <button class="btn-app" id="btn-cam-front">🔁 Alternar</button>
                <button class="btn-app" id="btn-cam-capture">📸 Foto</button>
                <button class="btn-app" id="btn-cam-stop">⏹ Parar</button>
            </div>
            <img id="cam-preview" style="display:none;width:100%;border-radius:8px;margin-top:8px;" />
            <canvas id="cam-canvas" style="display:none;"></canvas>
        </div>
    </div>

    <!-- TAB 3: GPS (LOCALIZAÇÃO CORRIGIDA) -->
    <div id="tab-gps" class="tab">
        <div class="card">
            <h3>📍 Geolocalização</h3>
            <div id="gps-info" class="dados-box">Toque em "📍 Obter Localização" para buscar suas coordenadas.</div>
            
            <div style="margin-top:10px;">
                <button class="btn-app" id="btn-gps-once">📍 Obter Localização</button>
                <button class="btn-app" id="btn-gps-watch">👁️ Rastrear</button>
            </div>

            <div id="maps-container" style="display:none; margin-top:10px;">
                <a id="maps-link" class="link-maps" href="#" target="_blank">🗺️ Ver no Google Maps</a>
            </div>
        </div>
    </div>

    <!-- TAB 4: ACELERÔMETRO -->
    <div id="tab-acelerometro" class="tab">
        <div class="card">
            <h3>📊 Sensor de Aceleração</h3>
            <div style="margin-bottom: 10px;">
                <span id="acel-status" class="status vermelho">⏹ Desativado</span>
            </div>
            <div id="acel-dados" class="dados-box">Toque em "▶ Iniciar Acelerômetro" para capturar os movimentos.</div>
            <div style="margin-top:10px;">
                <button class="btn-app" id="btn-acel-start">▶ Iniciar Acelerômetro</button>
                <button class="btn-app" id="btn-acel-stop">⏹ Parar</button>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // 1. PORTOS (JSON)
        // ============================================
        const portosContainer = document.getElementById('portos-container');
        const updateTime = document.getElementById('update-time');

        const portosData = [
            { nome: 'Porto de Santos', localizacao: 'Santos, SP', descricao: 'Maior porto da América Latina' },
            { nome: 'Porto do Rio', localizacao: 'Rio de Janeiro, RJ', descricao: 'Porto histórico' },
            { nome: 'Porto de Paranaguá', localizacao: 'Paranaguá, PR', descricao: 'Exportação de grãos' }
        ];

        function renderizarPortos() {
            portosContainer.innerHTML = portosData.map(p => `
                <div style="padding:10px;border-bottom:1px solid #eee;">
                    <strong>${p.nome}</strong><br>
                    📍 ${p.localizacao}<br>
                    <span style="font-size:0.85rem;color:#666;">${p.descricao}</span>
                </div>
            `).join('');
            updateTime.textContent = new Date().toLocaleTimeString();
        }
        renderizarPortos();

        // ============================================
        // 2. CÂMERA
        // ============================================
        const video = document.getElementById('video');
        const canvas = document.getElementById('cam-canvas');
        const preview = document.getElementById('cam-preview');
        let stream = null;
        let facingMode = 'environment';

        async function startCamera() {
            try {
                if (stream) stream.getTracks().forEach(t => t.stop());
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { ideal: facingMode }, width: { ideal: 640 }, height: { ideal: 480 } },
                    audio: false
                });
                video.srcObject = stream;
                await video.play();
            } catch (e) {
                console.warn('Câmera:', e.message);
            }
        }

        document.getElementById('btn-cam-front').addEventListener('click', () => {
            facingMode = facingMode === 'environment' ? 'user' : 'environment';
            startCamera();
        });

        document.getElementById('btn-cam-capture').addEventListener('click', () => {
            if (!video.videoWidth) return;
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            preview.src = canvas.toDataURL('image/jpeg');
            preview.style.display = 'block';
        });

        document.getElementById('btn-cam-stop').addEventListener('click', () => {
            if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; video.srcObject = null; }
        });

        // ============================================
        // 3. GPS (LOCALIZAÇÃO CORRIGIDA)
        // ============================================
        const gpsInfo = document.getElementById('gps-info');
        const mapsContainer = document.getElementById('maps-container');
        const mapsLink = document.getElementById('maps-link');
        let watchId = null;

        function atualizarGPS(pos) {
            const { latitude, longitude, accuracy, altitude, speed } = pos.coords;

            gpsInfo.textContent = 
                `✅ Localização Fixada!\n` +
                `Latitude:  ${latitude.toFixed(6)}°\n` +
                `Longitude: ${longitude.toFixed(6)}°\n` +
                `Precisão:  ${accuracy.toFixed(1)} metros\n` +
                `Altitude:  ${altitude !== null ? altitude.toFixed(1) + ' m' : 'N/A'}\n` +
                `Velocidade:${speed !== null ? (speed * 3.6).toFixed(1) + ' km/h' : '0 km/h'}\n` +
                `Hora:      ${new Date(pos.timestamp).toLocaleTimeString()}`;

            mapsLink.href = `https://www.google.com/maps?q=${latitude},${longitude}`;
            mapsContainer.style.display = 'block';
        }

        function erroGPS(err) {
            let msg = '';
            switch (err.code) {
                case 1:
                    msg = 'Permissão negada. Autorize o acesso à localização quando o navegador solicitar.';
                    break;
                case 2:
                    msg = 'Posição indisponível. Verifique se o GPS/Localização está ligado no Android.';
                    break;
                case 3:
                    msg = 'Tempo esgotado tentando fixar os satélites.';
                    break;
                default:
                    msg = err.message;
            }
            gpsInfo.textContent = `❌ Erro (${err.code}):\n${msg}`;
            mapsContainer.style.display = 'none';
        }

        const opcoesGPS = {
            enableHighAccuracy: true,
            timeout: 10000,
            maximumAge: 0
        };

        document.getElementById('btn-gps-once').addEventListener('click', () => {
            if (!navigator.geolocation) {
                gpsInfo.textContent = '❌ Geolocalização não é suportada por este navegador.';
                return;
            }
            gpsInfo.textContent = '⏳ Buscando coordenadas GPS (aguarde)...';
            navigator.geolocation.getCurrentPosition(atualizarGPS, erroGPS, opcoesGPS);
        });

        document.getElementById('btn-gps-watch').addEventListener('click', () => {
            const btnWatch = document.getElementById('btn-gps-watch');

            if (watchId) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
                gpsInfo.textContent = '⏹ Rastreamento finalizado.';
                btnWatch.textContent = '👁️ Rastrear';
                return;
            }

            if (!navigator.geolocation) {
                gpsInfo.textContent = '❌ Geolocalização não suportada.';
                return;
            }

            gpsInfo.textContent = '👁️ Rastreando em tempo real... Mova-se com o celular.';
            btnWatch.textContent = '⏹ Parar Rastreio';
            watchId = navigator.geolocation.watchPosition(atualizarGPS, erroGPS, opcoesGPS);
        });

        // ============================================
        // 4. ACELERÔMETRO (DEVICEMOTION)
        // ============================================
        const acelDados = document.getElementById('acel-dados');
        const acelStatus = document.getElementById('acel-status');
        let acelRunning = false;

        function handleMotion(e) {
            if (!acelRunning) return;

            // Usa acceleration ou o fallback accelerationIncludingGravity (comum no Chrome Android)
            const acc = (e.acceleration && e.acceleration.x !== null) 
                ? e.acceleration 
                : e.accelerationIncludingGravity;

            if (acc && (acc.x !== null || acc.y !== null)) {
                const x = (acc.x || 0).toFixed(2);
                const y = (acc.y || 0).toFixed(2);
                const z = (acc.z || 0).toFixed(2);

                acelDados.textContent = 
                    `📊 DADOS DE ACELERAÇÃO (m/s²):\n` +
                    `  Eixo X (Lateral):    ${x}\n` +
                    `  Eixo Y (Vertical):   ${y}\n` +
                    `  Eixo Z (Frente/Trás):${z}\n\n` +
                    `💡 Aceleração total detectada pelo sensor.`;

                acelStatus.className = 'status verde';
                acelStatus.textContent = '✅ Ativo';
            }
        }

        document.getElementById('btn-acel-start').addEventListener('click', async () => {
            if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
                try {
                    const res = await DeviceMotionEvent.requestPermission();
                    if (res !== 'granted') {
                        acelDados.textContent = '❌ Permissão negada no iOS.';
                        return;
                    }
                } catch (err) {
                    acelDados.textContent = `❌ Erro de permissão: ${err.message}`;
                    return;
                }
            }

            acelRunning = true;
            window.addEventListener('devicemotion', handleMotion);
            acelDados.textContent = '⏳ Capturando movimento... Mova o celular!';
        });

        document.getElementById('btn-acel-stop').addEventListener('click', () => {
            acelRunning = false;
            window.removeEventListener('devicemotion', handleMotion);
            acelDados.textContent = '⏹ Parado';
            acelStatus.className = 'status vermelho';
            acelStatus.textContent = '⏹ Desativado';
        });

        // ============================================
        // 5. NAVEGAÇÃO DE ABAS
        // ============================================
        document.querySelectorAll('.tab-bar button').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-bar button').forEach(b => b.classList.remove('ativo'));
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('ativo'));
                btn.classList.add('ativo');
                
                const target = document.getElementById(btn.dataset.tab);
                if (target) target.classList.add('ativo');

                if (btn.dataset.tab === 'tab-camera' && !stream) {
                    startCamera();
                }
            });
        });
    </script>
</body>
</html>
